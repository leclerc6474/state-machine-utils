[project]
name = "state-machine-utils"
version = "0.1.0"
description = "Finite state machine built from source-event-target-action tuples that raises on invalid transitions."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
